[workspace]
resolver = "2"
members = [
    "crates/saif-platform",
    "crates/saif-config",
    "crates/saif-persistence",
    "crates/saif-providers",
    "crates/saif-skills",
    "crates/saif-cron",
    "crates/saif-plugins",
    "crates/saif-tools",
    "crates/saif-core",
    "crates/saif-rpc-contract",
    "crates/saif-tui",
    "crates/saif-gateway",
    "crates/saif-web",
    "crates/saif-acp",
    "crates/saif-cli",
    "crates/saif-conformance",
]
exclude = [
    "apps/saif-desktop",
    "apps/saif-web-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
cron = "0.15"
crossterm = "0.28"
dotenvy = "0.15"
flate2 = "1.0"
futures-util = "0.3"
hex = "0.4"
ignore = "0.4"
portable-pty = "0.8"
rand = "0.9"
ratatui = "0.29"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = "0.29"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1.11", features = ["serde", "v4"] }

# Keep disk footprint small (< 3 GiB) on constrained build hosts.
[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
