<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saif Agent Desktop</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #070b14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    }
    .card {
      max-width: 440px;
      padding: 28px 32px;
      border-radius: 14px;
      background: #0f172a;
      border: 1px solid #1e293b;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 20px; color: #f8fafc; }
    p { margin: 0 0 18px; font-size: 14px; color: #94a3b8; line-height: 1.5; }
    code { color: #38bdf8; }
    a.btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      background: #f97316;
      color: #0b0f19;
      font-weight: 700;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Saif Agent Desktop</h1>
    <p id="status">Connecting to local runtime at <code>127.0.0.1:8788</code>...</p>
    <a class="btn" href="http://127.0.0.1:8788/">Open Dashboard</a>
  </div>
  <script>
    const target = "http://127.0.0.1:8788/";
    async function waitForBackend() {
      try {
        const res = await fetch(target + "api/status", { mode: "no-cors" });
        if (res) {
          window.location.replace(target);
          return;
        }
      } catch (_) {}
      setTimeout(waitForBackend, 600);
    }
    waitForBackend();
  </script>
</body>
</html>
