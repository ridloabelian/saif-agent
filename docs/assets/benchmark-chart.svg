<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" role="img" aria-label="Saif Agent Performance and Verification Benchmarks">
  <defs>
    <linearGradient id="benchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="fastBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="slowBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <style><![CDATA[
    .grow-slow {
      animation: growSlow 5s ease-out infinite;
    }
    .grow-fast {
      animation: growFast 5s ease-out infinite;
    }
    .badge-pop {
      animation: badgePop 2.8s ease-in-out infinite;
    }
    @keyframes growSlow {
      0% { width: 20px; }
      25%, 90% { width: 520px; }
      100% { width: 20px; }
    }
    @keyframes growFast {
      0% { width: 4px; }
      20%, 90% { width: 16px; }
      100% { width: 4px; }
    }
    @keyframes badgePop {
      0%, 100% { opacity: 0.82; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .grow-slow { animation: none !important; width: 520px; }
      .grow-fast { animation: none !important; width: 16px; }
      .badge-pop { animation: none !important; }
    }
  ]]></style>

  <rect x="2" y="2" width="996" height="276" rx="14" fill="url(#benchBg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="38" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="1.4" fill="#38BDF8">
    MEASURED COLD STARTUP &amp; CONFORMANCE BASELINE
  </text>

  <!-- Highlight Pill -->
  <g class="badge-pop">
    <rect x="774" y="18" width="194" height="32" rx="16" fill="#064E3B" stroke="#10B981" stroke-width="1.3"/>
    <text x="871" y="38" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="700" fill="#6EE7B7">
      229.4x FASTER COLD START
    </text>
  </g>

  <line x1="32" y1="58" x2="968" y2="58" stroke="#1E293B" stroke-width="1"/>

  <!-- Bar 1: Saif Agent -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
    <text x="32" y="92" font-size="14" font-weight="700" fill="#F8FAFC">Saif Agent (Pure Rust)</text>
    <text x="32" y="110" font-size="12" fill="#94A3B8">saif --version (5-run median, isolated temp home)</text>
    <rect x="330" y="78" width="520" height="28" rx="6" fill="#0B1220" stroke="#1E293B"/>
    <rect class="grow-fast" x="330" y="78" width="16" height="28" rx="6" fill="url(#fastBar)"/>
    <text x="358" y="97" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13.5" font-weight="700" fill="#34D399">2.51 ms</text>
  </g>

  <!-- Bar 2: Python Reference -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
    <text x="32" y="150" font-size="14" font-weight="600" fill="#CBD5E1">Reference Python CLI</text>
    <text x="32" y="168" font-size="12" fill="#64748B">hermes --version (read-only baseline)</text>
    <rect x="330" y="136" width="520" height="28" rx="6" fill="#0B1220" stroke="#1E293B"/>
    <rect class="grow-slow" x="330" y="136" width="520" height="28" rx="6" fill="url(#slowBar)"/>
    <text x="866" y="155" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13.5" font-weight="700" fill="#94A3B8">575.83 ms</text>
  </g>

  <line x1="32" y1="192" x2="968" y2="192" stroke="#1E293B" stroke-width="1"/>

  <!-- Bottom Metrics Cards -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace">
    <rect x="32" y="208" width="298" height="50" rx="8" fill="#0B1220" stroke="#1E293B"/>
    <text x="50" y="229" font-size="11" fill="#64748B">RUNTIME DEPENDENCIES</text>
    <text x="50" y="247" font-size="13.5" font-weight="700" fill="#FDBA74">0 Python / 0 Node.js (Static Binary)</text>

    <rect x="351" y="208" width="298" height="50" rx="8" fill="#0B1220" stroke="#1E293B"/>
    <text x="369" y="229" font-size="11" fill="#64748B">GOLDEN BEHAVIORAL ORACLE</text>
    <text x="369" y="247" font-size="13.5" font-weight="700" fill="#38BDF8">120 Cases Across 10 Suites</text>

    <rect x="670" y="208" width="298" height="50" rx="8" fill="#0B1220" stroke="#1E293B"/>
    <text x="688" y="229" font-size="11" fill="#64748B">CI QUALITY &amp; TEST GATE</text>
    <text x="688" y="247" font-size="13.5" font-weight="700" fill="#34D399">40 Suites Passing · 0 Warnings</text>
  </g>
</svg>
