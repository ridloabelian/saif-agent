<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="100%" role="img" aria-label="Saif Agent Hero Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="52%" stop-color="#0C1322"/>
      <stop offset="100%" stop-color="#090E1A"/>
    </linearGradient>
    <radialGradient id="rustAura" cx="18%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#EA580C" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanAura" cx="84%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.24"/>
      <stop offset="65%" stop-color="#0284C7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="bladeMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="45%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="bladeEdge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="55%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="borderShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridPat" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <style><![CDATA[
    .trace-flow {
      stroke-dasharray: 14 10;
      animation: dashFlow 5s linear infinite;
    }
    .trace-flow-rev {
      stroke-dasharray: 10 14;
      animation: dashFlowRev 7s linear infinite;
    }
    .ember-1 { animation: floatEmber 4.6s ease-in-out infinite; }
    .ember-2 { animation: floatEmber 5.8s ease-in-out 1.1s infinite; }
    .ember-3 { animation: floatEmber 6.4s ease-in-out 2.2s infinite; }
    .pulse-ring { animation: pulseRing 3.6s ease-in-out infinite; transform-origin: 170px 145px; }
    .blade-float { animation: bladeHover 4.2s ease-in-out infinite; }
    .scan-bar { animation: scanSweep 6s ease-in-out infinite; }
    .pill-dot { animation: dotBlink 2.2s ease-in-out infinite; }

    @keyframes dashFlow {
      to { stroke-dashoffset: -144; }
    }
    @keyframes dashFlowRev {
      to { stroke-dashoffset: 144; }
    }
    @keyframes floatEmber {
      0%, 100% { transform: translateY(0px); opacity: 0.35; }
      50% { transform: translateY(-14px); opacity: 0.95; }
    }
    @keyframes pulseRing {
      0%, 100% { opacity: 0.35; transform: scale(0.98); }
      50% { opacity: 0.85; transform: scale(1.03); }
    }
    @keyframes bladeHover {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes scanSweep {
      0%, 100% { transform: translateX(-220px); opacity: 0; }
      20% { opacity: 0.55; }
      80% { opacity: 0.55; }
      95% { transform: translateX(1120px); opacity: 0; }
    }
    @keyframes dotBlink {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .trace-flow, .trace-flow-rev, .ember-1, .ember-2, .ember-3, .pulse-ring, .blade-float, .scan-bar, .pill-dot {
        animation: none !important;
      }
    }
  ]]></style>

  <!-- Base Card -->
  <rect x="2" y="2" width="1096" height="336" rx="18" fill="url(#bgGrad)" stroke="url(#borderShine)" stroke-width="2"/>
  <rect x="3" y="3" width="1094" height="334" rx="17" fill="url(#gridPat)"/>
  <rect x="3" y="3" width="1094" height="334" rx="17" fill="url(#rustAura)"/>
  <rect x="3" y="3" width="1094" height="334" rx="17" fill="url(#cyanAura)"/>

  <!-- Animated circuit tracks -->
  <path d="M 40 72 L 108 72 L 136 44 L 310 44" fill="none" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1.5"/>
  <path class="trace-flow" d="M 40 72 L 108 72 L 136 44 L 310 44" fill="none" stroke="#38BDF8" stroke-opacity="0.85" stroke-width="1.5"/>

  <path d="M 1058 64 L 920 64 L 882 102 L 730 102" fill="none" stroke="#F97316" stroke-opacity="0.25" stroke-width="1.5"/>
  <path class="trace-flow-rev" d="M 1058 64 L 920 64 L 882 102 L 730 102" fill="none" stroke="#F97316" stroke-opacity="0.82" stroke-width="1.5"/>

  <path d="M 1058 242 L 950 242 L 916 208 L 790 208" fill="none" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.4"/>
  <path class="trace-flow" d="M 1058 242 L 950 242 L 916 208 L 790 208" fill="none" stroke="#38BDF8" stroke-opacity="0.72" stroke-width="1.4"/>

  <!-- Subtle diagonal energy beam -->
  <rect class="scan-bar" x="0" y="3" width="160" height="334" fill="#38BDF8" fill-opacity="0.035"/>

  <!-- Floating Embers / Nodes -->
  <g filter="url(#glowSoft)">
    <circle class="ember-1" cx="286" cy="70" r="3.2" fill="#38BDF8"/>
    <circle class="ember-2" cx="980" cy="118" r="3" fill="#F97316"/>
    <circle class="ember-3" cx="892" cy="54" r="2.6" fill="#FDBA74"/>
    <circle class="ember-1" cx="1018" cy="186" r="2.5" fill="#38BDF8"/>
    <circle class="ember-2" cx="256" cy="212" r="2.8" fill="#F97316"/>
  </g>

  <!-- Left Vector Cyber-Blade Emblem -->
  <g>
    <polygon class="pulse-ring" points="170,63 228,87 252,145 228,203 170,227 112,203 88,145 112,87" fill="#0B1220" fill-opacity="0.92" stroke="#1E293B" stroke-width="2"/>
    <polygon points="170,71 222,93 244,145 222,197 170,219 118,197 96,145 118,93" fill="none" stroke="url(#bladeEdge)" stroke-width="1.5" stroke-opacity="0.8"/>

    <g class="blade-float" filter="url(#glowSoft)">
      <!-- Curved scimitar blade -->
      <path d="M 128 192 C 148 168 176 132 214 86 C 194 128 176 164 148 196 Z" fill="url(#bladeMetal)" stroke="url(#bladeEdge)" stroke-width="1.8"/>
      <!-- Glowing edge spine -->
      <path d="M 134 188 C 156 164 184 128 212 88" fill="none" stroke="#F97316" stroke-width="2.6" stroke-linecap="round"/>
      <!-- Cyan neural fuller trace -->
      <path d="M 149 178 C 166 156 184 132 199 108" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Crossguard & hilt -->
      <path d="M 122 180 L 154 202" stroke="#FDBA74" stroke-width="4" stroke-linecap="round"/>
      <path d="M 136 193 L 122 211" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="120" cy="213" r="3.5" fill="#F97316"/>
    </g>
  </g>

  <!-- Main Typography -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
    <text x="292" y="102" font-size="13" font-weight="700" letter-spacing="3.2" fill="#38BDF8">PURE-RUST AUTONOMOUS AGENT RUNTIME</text>
    <text x="290" y="162" font-size="60" font-weight="800" letter-spacing="2" fill="url(#titleGrad)">SAIF AGENT</text>
    <text x="292" y="198" font-size="19" font-weight="500" fill="#CBD5E1">
      Single static native binary with <tspan fill="#FDBA74" font-weight="700">zero Python / Node</tspan> — 1:1 behavioral parity, fail-closed security, &amp; WASM dashboard.
    </text>
  </g>

  <!-- Bottom Feature Pills -->
  <g font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600">
    <!-- Pill 1 -->
    <rect x="292" y="242" width="154" height="36" rx="18" fill="#0F172A" stroke="#F97316" stroke-opacity="0.65" stroke-width="1.2"/>
    <circle class="pill-dot" cx="312" cy="260" r="4" fill="#F97316"/>
    <text x="324" y="264" fill="#F8FAFC">2.51 ms Cold Start</text>

    <!-- Pill 2 -->
    <rect x="458" y="242" width="142" height="36" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle class="pill-dot" cx="478" cy="260" r="4" fill="#38BDF8"/>
    <text x="490" y="264" fill="#F8FAFC">100% Pure Rust</text>

    <!-- Pill 3 -->
    <rect x="612" y="242" width="134" height="36" rx="18" fill="#0F172A" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle class="pill-dot" cx="632" cy="260" r="4" fill="#10B981"/>
    <text x="644" y="264" fill="#F8FAFC">36 Providers</text>

    <!-- Pill 4 -->
    <rect x="758" y="242" width="134" height="36" rx="18" fill="#0F172A" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle class="pill-dot" cx="778" cy="260" r="4" fill="#A78BFA"/>
    <text x="790" y="264" fill="#F8FAFC">30 Gateways</text>

    <!-- Pill 5 -->
    <rect x="904" y="242" width="148" height="36" rx="18" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle class="pill-dot" cx="924" cy="260" r="4" fill="#F59E0B"/>
    <text x="936" y="264" fill="#F8FAFC">224 KB WASM UI</text>
  </g>
</svg>
