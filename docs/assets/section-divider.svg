<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 18" width="100%" role="presentation">
  <defs>
    <linearGradient id="divTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0"/>
      <stop offset="25%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="75%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shuttleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="8" width="1000" height="2" rx="1" fill="url(#divTrack)"/>
  <rect x="0" y="7" width="160" height="4" rx="2" fill="url(#shuttleGrad)">
    <animate attributeName="x" values="-160;1000;-160" dur="5.5s" repeatCount="indefinite"/>
  </rect>
</svg>
