<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" role="img" aria-label="Saif Agent Animated Terminal and TUI Demo">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#060A13"/>
    </linearGradient>
    <linearGradient id="hdrBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <style><![CDATA[
    .l1 { animation: stepReveal1 14s infinite; }
    .l2 { animation: stepReveal2 14s infinite; }
    .l3 { animation: stepReveal3 14s infinite; }
    .l4 { animation: stepReveal4 14s infinite; }
    .l5 { animation: stepReveal5 14s infinite; }
    .l6 { animation: stepReveal6 14s infinite; }
    .l7 { animation: stepReveal7 14s infinite; }
    .l8 { animation: stepReveal8 14s infinite; }
    .cursor { animation: blinkCursor 1s steps(2, start) infinite; }
    .health-pulse { animation: pulseHealth 2.2s ease-in-out infinite; }
    .bar-fill { animation: meterSweep 7s ease-in-out infinite; }

    @keyframes stepReveal1 { 0%, 2% { opacity: 0; } 5%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes stepReveal2 { 0%, 10% { opacity: 0; } 14%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes stepReveal3 { 0%, 20% { opacity: 0; } 24%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes stepReveal4 { 0%, 31% { opacity: 0; } 35%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes stepReveal5 { 0%, 42% { opacity: 0; } 46%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes stepReveal6 { 0%, 54% { opacity: 0; } 58%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes stepReveal7 { 0%, 66% { opacity: 0; } 70%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes stepReveal8 { 0%, 76% { opacity: 0; } 80%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes blinkCursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulseHealth { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes meterSweep {
      0%, 100% { width: 172px; }
      50% { width: 214px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .l1, .l2, .l3, .l4, .l5, .l6, .l7, .l8 { animation: none !important; opacity: 1 !important; }
      .cursor, .health-pulse, .bar-fill { animation: none !important; }
    }
  ]]></style>

  <!-- Outer Window -->
  <rect x="2" y="2" width="996" height="496" rx="14" fill="url(#termBg)" stroke="#1E293B" stroke-width="2"/>
  <rect x="2" y="2" width="996" height="42" rx="14" fill="url(#hdrBg)"/>
  <rect x="2" y="30" width="996" height="14" fill="url(#hdrBg)"/>
  <line x1="2" y1="44" x2="998" y2="44" stroke="url(#accentLine)" stroke-opacity="0.55" stroke-width="1.2"/>

  <!-- Window Traffic Lights -->
  <circle cx="26" cy="23" r="6" fill="#EF4444"/>
  <circle cx="46" cy="23" r="6" fill="#F59E0B"/>
  <circle cx="66" cy="23" r="6" fill="#10B981"/>

  <g font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="500" y="27" text-anchor="middle" font-size="13" font-weight="600" fill="#94A3B8">saif --tui  ·  Profile: default  ·  100% Pure Rust (Zero Python / Node)</text>

    <!-- Left Pane: Agent Session Box -->
    <rect x="20" y="62" width="668" height="416" rx="10" fill="#090F1D" stroke="#1E293B" stroke-width="1.4"/>
    <text x="38" y="84" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#38BDF8">AGENT STREAM  //  SQLITE FTS5 HYDRATED</text>
    <line x1="20" y1="96" x2="688" y2="96" stroke="#1E293B" stroke-width="1"/>

    <!-- Staggered Terminal Lines -->
    <g font-size="13">
      <text class="l1" x="36" y="128" fill="#F8FAFC">
        <tspan fill="#F97316" font-weight="700">$</tspan> saif -q "Audit auth failover &amp; replay golden conformance"
      </text>

      <text class="l2" x="36" y="164" fill="#94A3B8">
        <tspan fill="#38BDF8">[system[0]]</tspan> Byte-stable prefix locked  ·  <tspan fill="#10B981">KV cache HIT (100%)</tspan>
      </text>

      <text class="l3" x="36" y="200" fill="#E2E8F0">
        <tspan fill="#F59E0B">[tool_search]</tspan> BM25 matched 3 tools in <tspan fill="#38BDF8">0.4 ms</tspan>
      </text>

      <text class="l4" x="36" y="236" fill="#CBD5E1">
        <tspan fill="#F97316">[execute_code]</tspan> RPC loopback checking 36 routes + AWS SigV4...
      </text>

      <text class="l5" x="36" y="272" fill="#CBD5E1">
        <tspan fill="#A78BFA">[delegate_task]</tspan> Child depth 1/2 replaying 120 golden oracle cases
      </text>

      <text class="l6" x="36" y="310" fill="#34D399" font-weight="600">
        ✓ 39/39 workspace + 1/1 WASM suites OK | rotated HTTP 429 -&gt; key #2
      </text>

      <text class="l7" x="36" y="346" fill="#CBD5E1">
        <tspan fill="#38BDF8">[curator]</tspan> Indexed skill 'failover-audit' (scan_for_threats: <tspan fill="#34D399">CLEAN</tspan>)
      </text>

      <g class="l8">
        <rect x="36" y="374" width="636" height="44" rx="7" fill="#0F172A" stroke="#10B981" stroke-opacity="0.45" stroke-width="1"/>
        <text x="50" y="401" font-size="13" fill="#E2E8F0">
          <tspan fill="#10B981" font-weight="700">Assistant:</tspan> Failover, SecretScope, and conformance checks verified cleanly.
        </text>
      </g>

      <text x="36" y="454" font-size="13.5" fill="#F8FAFC">
        <tspan fill="#F97316" font-weight="700">saif&gt;</tspan> <tspan fill="#64748B">Type prompt, /stop, /steer, or Ctrl+C...</tspan>
      </text>
      <rect class="cursor" x="406" y="440" width="9" height="17" rx="1.5" fill="#38BDF8"/>
    </g>

    <!-- Right Pane: Telemetry Sidebar -->
    <rect x="704" y="62" width="276" height="416" rx="10" fill="#090F1D" stroke="#1E293B" stroke-width="1.4"/>
    <circle class="health-pulse" cx="724" cy="79" r="5" fill="#10B981"/>
    <text x="738" y="84" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#FDBA74">RUNTIME TELEMETRY</text>
    <line x1="704" y1="96" x2="980" y2="96" stroke="#1E293B" stroke-width="1"/>

    <g font-size="12">
      <text x="722" y="124" fill="#64748B">COLD START (MEDIAN)</text>
      <text x="722" y="144" font-size="16" font-weight="700" fill="#38BDF8">2.51 ms</text>
      <text x="802" y="144" font-size="11.5" fill="#10B981">229.4x faster</text>

      <line x1="722" y1="160" x2="962" y2="160" stroke="#1E293B" stroke-width="1"/>

      <text x="722" y="184" fill="#64748B">BINARY FOOTPRINT</text>
      <text x="722" y="204" fill="#E2E8F0">saif (CLI/Gateway): <tspan fill="#FDBA74" font-weight="700">14 MB</tspan></text>
      <text x="722" y="224" fill="#E2E8F0">WASM UI Bundle:   <tspan fill="#38BDF8" font-weight="700">224 KB</tspan></text>

      <line x1="722" y1="242" x2="962" y2="242" stroke="#1E293B" stroke-width="1"/>

      <text x="722" y="266" fill="#64748B">SECURITY INVARIANTS</text>
      <text x="722" y="288" fill="#34D399">● SecretScope: FAIL-CLOSED</text>
      <text x="722" y="308" fill="#34D399">● SecretRedactor: ARMED</text>
      <text x="722" y="328" fill="#34D399">● Plugin SHA-40: VERIFIED</text>

      <line x1="722" y1="346" x2="962" y2="346" stroke="#1E293B" stroke-width="1"/>

      <text x="722" y="370" fill="#64748B">STATE &amp; CONFORMANCE</text>
      <text x="722" y="392" fill="#E2E8F0">SQLite Schema v32 + FTS5</text>
      <text x="722" y="412" fill="#E2E8F0">Upstream Lock: <tspan fill="#10B981" font-weight="700">UP_TO_DATE</tspan></text>

      <!-- Animated Throughput Meter -->
      <text x="722" y="440" font-size="11" fill="#64748B">POOL CAPACITY</text>
      <rect x="722" y="450" width="236" height="8" rx="4" fill="#1E293B"/>
      <rect class="bar-fill" x="722" y="450" width="190" height="8" rx="4" fill="url(#accentLine)"/>
    </g>
  </g>
</svg>
