name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --bins --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          STAGE="stage-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp LICENSE NOTICE "$STAGE/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/saif.exe" "$STAGE/"
            cp "target/${{ matrix.target }}/release/saif-acp.exe" "$STAGE/"
            (cd "$STAGE" && 7z a "../saif-${{ matrix.target }}.zip" .)
          else
            cp "target/${{ matrix.target }}/release/saif" "$STAGE/"
            cp "target/${{ matrix.target }}/release/saif-acp" "$STAGE/"
            chmod +x "$STAGE/saif" "$STAGE/saif-acp"
            tar -czf "saif-${{ matrix.target }}.tar.gz" -C "$STAGE" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: saif-${{ matrix.target }}
          path: saif-*.${{ matrix.archive }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Prepare multi-arch GHCR container context
        run: |
          mkdir -p ghcr-ctx/linux/amd64 ghcr-ctx/linux/arm64
          tar -xzf dist/saif-x86_64-unknown-linux-gnu.tar.gz -C ghcr-ctx/linux/amd64
          tar -xzf dist/saif-aarch64-unknown-linux-gnu.tar.gz -C ghcr-ctx/linux/arm64
          cat <<'EOF' > ghcr-ctx/Dockerfile
          FROM ubuntu:24.04
          ARG TARGETPLATFORM
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git \
              && rm -rf /var/lib/apt/lists/* \
              && useradd -m -u 10001 -s /bin/sh saif \
              && mkdir -p /data/.saif && chown -R saif:saif /data
          COPY ${TARGETPLATFORM}/saif /usr/local/bin/saif
          COPY ${TARGETPLATFORM}/saif-acp /usr/local/bin/saif-acp
          USER saif
          ENV SAIF_HOME=/data/.saif
          EXPOSE 8788 8642
          ENTRYPOINT ["saif"]
          CMD ["status"]
          EOF

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ghcr-ctx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ridloabelian/saif-agent:latest
            ghcr.io/ridloabelian/saif-agent:${{ github.ref_name }}
