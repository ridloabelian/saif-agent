name: Desktop

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-aarch64
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate Tauri icon set
        working-directory: apps/saif-desktop/src-tauri
        run: npx --yes @tauri-apps/cli@^2 icon ../../../docs/assets/saif-emblem.png

      - name: Build saif sidecar binary
        run: cargo build --release --bin saif

      - name: Build Tauri desktop bundle
        working-directory: apps/saif-desktop/src-tauri
        run: |
          cargo check
          npx --yes @tauri-apps/cli@^2 build --no-bundle || cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: saif-desktop-${{ matrix.name }}
          path: |
            apps/saif-desktop/src-tauri/target/release/saif-desktop*
            apps/saif-desktop/src-tauri/target/release/bundle/**
          if-no-files-found: warn
